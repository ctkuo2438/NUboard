spring:

  thymeleaf:
    check-template-location: false
    
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nuboard}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}

    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      platform: postgres

  jpa:
    hibernate:
      ddl-auto: update # auto update db
    show-sql: true # sql log
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:352891072128-heqdb478kgmq5iap034l9192pvgq5trf.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope: profile, email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

server:
  port: 8080

# Frontend URL configuration
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

# SnowflakeID
id:
  generator:
    workerId: 1
    datacenterId: 0           
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

    # Spring Security OAuth2 logging
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.web: DEBUG

    # Transaction logging
    org.springframework.transaction: DEBUG
    org.springframework.orm.jpa: TRACE

  # File logging (save logs to file)
  file:
    name: logs/application.log

  # Enhanced log patterns
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
